version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: etbp
      POSTGRES_PASSWORD: etbp
      POSTGRES_DB: etbp
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U etbp']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: etbp
      DB_PASSWORD: etbp
      DB_NAME: etbp
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-production
      QR_SECRET: change-me-qr
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  organizer:
    build:
      context: .
      dockerfile: docker/Dockerfile.organizer
    ports:
      - '8080:80'
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
    ports:
      - '8081:80'
    depends_on:
      - api

  mobile:
    build:
      context: .
      dockerfile: docker/Dockerfile.mobile
    ports:
      - '8082:8081'
    environment:
      API_URL: http://api:3000/api/v1
    depends_on:
      - api

volumes:
  pgdata:
